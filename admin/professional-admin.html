<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Media Crew - Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --black: #0a0a0a;
            --white: #f5f0eb;
            --red: #c8102e;
            --gold: #b8a06a;
            --grey: #1e1e1e;
            --mid: #3a3a3a;
        }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
        }
        
        .header {
            background: linear-gradient(135deg, var(--red) 0%, #8a0a20 100%);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(200, 16, 46, 0.3);
        }
        
        .header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 36px;
            letter-spacing: 3px;
            color: var(--white);
        }
        
        .header .nav {
            display: flex;
            gap: 30px;
        }
        
        .header .nav a {
            color: var(--white);
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            transition: all 0.3s;
            position: relative;
        }
        
        .header .nav a:hover {
            color: var(--gold);
        }
        
        .header .nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: width 0.3s;
        }
        
        .header .nav a:hover::after {
            width: 100%;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .section {
            background: var(--grey);
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 30px;
            border: 1px solid rgba(200, 16, 46, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        .section h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            margin-bottom: 30px;
            color: var(--red);
            letter-spacing: 2px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--white);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 15px 20px;
            background: var(--black);
            border: 2px solid var(--mid);
            border-radius: 8px;
            color: var(--white);
            font-size: 16px;
            transition: all 0.3s;
            font-family: 'DM Sans', sans-serif;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--red);
            box-shadow: 0 0 20px rgba(200, 16, 46, 0.2);
        }
        
        .form-group select option {
            background: var(--grey);
            color: var(--white);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'DM Sans', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-primary {
            background: var(--red);
            color: var(--white);
        }
        
        .btn-primary:hover {
            background: #e63232;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(200, 16, 46, 0.4);
        }
        
        .btn-secondary {
            background: var(--mid);
            color: var(--white);
            border: 2px solid var(--mid);
        }
        
        .btn-secondary:hover {
            background: var(--grey);
            border-color: var(--red);
        }
        
        .btn-danger {
            background: #ef4444;
            color: var(--white);
            padding: 10px 20px;
            font-size: 14px;
        }
        
        .btn-danger:hover {
            background: #ff6b6b;
        }
        
        .btn-success {
            background: #10b981;
            color: var(--white);
        }
        
        .btn-success:hover {
            background: #34d399;
        }
        
        .file-upload {
            border: 2px dashed var(--mid);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: var(--black);
        }
        
        .file-upload:hover {
            border-color: var(--red);
            background: rgba(200, 16, 46, 0.05);
        }
        
        .file-upload i {
            font-size: 48px;
            color: var(--red);
            margin-bottom: 15px;
        }
        
        .file-upload p {
            color: var(--white);
            font-size: 16px;
        }
        
        .file-upload input {
            display: none;
        }
        
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
        
        .media-card {
            background: var(--black);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--mid);
            transition: all 0.3s;
        }
        
        .media-card:hover {
            transform: translateY(-5px);
            border-color: var(--red);
            box-shadow: 0 15px 40px rgba(200, 16, 46, 0.2);
        }
        
        .media-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        
        .media-card .content {
            padding: 20px;
        }
        
        .media-card h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: var(--white);
        }
        
        .media-card .meta {
            font-size: 13px;
            color: #888;
            margin-bottom: 5px;
        }
        
        .media-card .event-tag {
            display: inline-block;
            background: rgba(200, 16, 46, 0.2);
            color: var(--red);
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .media-card .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .event-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .event-card {
            background: var(--black);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid var(--mid);
            transition: all 0.3s;
        }
        
        .event-card:hover {
            border-color: var(--red);
            transform: translateY(-3px);
        }
        
        .event-card h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: var(--white);
        }
        
        .event-card .date {
            color: var(--gold);
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .event-card .description {
            color: #888;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        .event-card .actions {
            display: flex;
            gap: 10px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
        
        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            color: var(--mid);
        }
        
        .status-message {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .status-message.success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #10b981;
        }
        
        .status-message.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #ef4444;
        }
        
        @media (max-width: 768px) {
            .header {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }
            
            .header h1 {
                font-size: 28px;
            }
            
            .header .nav {
                gap: 15px;
            }
            
            .container {
                padding: 20px 15px;
            }
            
            .section {
                padding: 25px;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .media-grid,
            .event-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>DSA MEDIA CREW</h1>
        <nav class="nav">
            <a href="/gallery.html">Gallery</a>
            <a href="/upload">Admin Portal</a>
        </nav>
    </div>
    
    <div class="container">
        <div class="status-message" id="statusMessage"></div>
        
        <!-- Upload Section -->
        <div class="section">
            <h2>📤 Upload Media</h2>
            <form id="uploadForm" action="/api/upload" method="POST" enctype="multipart/form-data">
                <div class="form-row">
                    <div class="form-group">
                        <label>Title *</label>
                        <input type="text" name="title" placeholder="Enter title for this media" required>
                    </div>
                    <div class="form-group">
                        <label>Category *</label>
                        <select name="category" required>
                            <option value="">Select Category</option>
                            <option value="photography">Photography</option>
                            <option value="videography">Videography</option>
                            <option value="cultural">Cultural</option>
                            <option value="sports">Sports</option>
                            <option value="events">Events</option>
                            <option value="achievements">Achievements</option>
                            <option value="team-bts">Team BTS</option>
                            <option value="archives">Archives</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Event</label>
                        <select name="eventName" id="eventSelect">
                            <option value="">No Event</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" name="description" placeholder="Brief description">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>File *</label>
                    <input type="file" id="fileInput" name="file" accept="image/*,video/*" required style="width: 100%; padding: 10px; background: var(--black); color: var(--white); border: 1px solid var(--mid); border-radius: 8px;">
                    <p id="fileName" style="margin-top: 10px; color: var(--gold);"></p>
                </div>
                
                <button type="submit" class="btn btn-primary">Upload Media</button>
            </form>
        </div>
        
        <!-- Events Section -->
        <div class="section">
            <h2>📅 Manage Events</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Event Name *</label>
                    <input type="text" id="newEventName" placeholder="Enter event name">
                </div>
                <div class="form-group">
                    <label>Event Date *</label>
                    <input type="date" id="newEventDate">
                </div>
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" id="newEventDescription" placeholder="Event description">
            </div>
            <button class="btn btn-success" onclick="addEvent()">Add Event</button>
            
            <div class="event-list" id="eventList"></div>
        </div>
        
        <!-- Media Section -->
        <div class="section">
            <h2>📁 Uploaded Media</h2>
            <button class="btn btn-secondary" onclick="loadMedia()">Refresh</button>
            <div class="media-grid" id="mediaGrid"></div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Load events and media on page load
            loadEvents();
            loadMedia();
            
            // File input change handler
            const fileInput = document.getElementById('fileInput');
            if (fileInput) {
                fileInput.addEventListener('change', function() {
                    const fileName = this.files[0] ? this.files[0].name : '';
                    document.getElementById('fileName').textContent = fileName ? 'Selected: ' + fileName : '';
                });
            }
        });
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = 'status-message ' + type;
            statusDiv.style.display = 'block';
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 5000);
        }
        
        // Upload form handling
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const fileInput = document.getElementById('fileInput');
            
            if (!fileInput.files[0]) {
                showStatus('Please select a file', 'error');
                return;
            }
            
            showStatus('Uploading...', 'success');
            
            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showStatus('Media uploaded successfully!', 'success');
                    e.target.reset();
                    document.getElementById('fileName').textContent = '';
                    loadMedia();
                } else {
                    showStatus(data.error || 'Upload failed', 'error');
                }
            } catch (error) {
                console.error('Upload error:', error);
                showStatus('Upload failed: ' + error.message, 'error');
            }
        });
        
        // Load events
        async function loadEvents() {
            try {
                const response = await fetch('/api/events');
                const events = await response.json();
                
                const select = document.getElementById('eventSelect');
                select.innerHTML = '<option value="">No Event</option>';
                events.forEach(event => {
                    select.innerHTML += `<option value="${event.name}">${event.name}</option>`;
                });
                
                const eventList = document.getElementById('eventList');
                if (events.length > 0) {
                    eventList.innerHTML = events.map(event => `
                        <div class="event-card">
                            <h3>${event.name}</h3>
                            <div class="date">📅 ${event.date}</div>
                            <div class="description">${event.description || 'No description'}</div>
                            <div class="actions">
                                <button class="btn btn-danger" onclick="deleteEvent('${event.name}')">Delete</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    eventList.innerHTML = '<div class="empty-state"><i class="fas fa-calendar"></i><p>No events created yet</p></div>';
                }
            } catch (error) {
                console.error('Error loading events:', error);
            }
        }
        
        // Add event
        async function addEvent() {
            const name = document.getElementById('newEventName').value;
            const date = document.getElementById('newEventDate').value;
            const description = document.getElementById('newEventDescription').value;
            
            if (!name || !date) {
                showStatus('Please enter event name and date', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/events', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, date, description })
                });
                
                if (response.ok) {
                    showStatus('Event added successfully!', 'success');
                    document.getElementById('newEventName').value = '';
                    document.getElementById('newEventDate').value = '';
                    document.getElementById('newEventDescription').value = '';
                    loadEvents();
                } else {
                    showStatus('Failed to add event', 'error');
                }
            } catch (error) {
                showStatus('Error adding event: ' + error.message, 'error');
            }
        }
        
        // Delete event
        async function deleteEvent(eventName) {
            if (confirm('Delete event "' + eventName + '"?')) {
                try {
                    const response = await fetch(`/api/events/${encodeURIComponent(eventName)}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        showStatus('Event deleted successfully!', 'success');
                        loadEvents();
                    } else {
                        showStatus('Failed to delete event', 'error');
                    }
                } catch (error) {
                    showStatus('Error deleting event: ' + error.message, 'error');
                }
            }
        }
        
        // Load media
        async function loadMedia() {
            try {
                const response = await fetch('/api/upload/files');
                const data = await response.json();
                
                console.log('Media data:', data);
                console.log('First file:', data.files[0]);
                
                const mediaGrid = document.getElementById('mediaGrid');
                if (data.files && data.files.length > 0) {
                    mediaGrid.innerHTML = data.files.map(f => {
                        console.log('File:', f.filename, 'Has base64:', !!f.base64, 'Base64 length:', f.base64 ? f.base64.length : 0);
                        
                        // Try base64 first, if it exists and has reasonable length
                        let imageSrc;
                        if (f.base64 && f.base64.length > 100) {
                            imageSrc = `data:${f.mimeType};base64,${f.base64}`;
                            console.log('Using base64 for:', f.filename);
                        } else {
                            imageSrc = f.url;
                            console.log('Using URL for:', f.filename);
                        }
                        
                        return `
                        <div class="media-card">
                            <img src="${imageSrc}" alt="${f.title || f.filename}" 
                                 onerror="console.error('Image failed:', this.src); this.parentElement.style.background='#1e1e1e'; this.style.display='none';">
                            <div class="content">
                                <h3>${f.title || f.filename}</h3>
                                ${f.eventName ? `<span class="event-tag">📅 ${f.eventName}</span>` : ''}
                                <div class="meta">Category: ${f.category || 'General'}</div>
                                <div class="meta">Size: ${(f.size / 1024).toFixed(1)} KB</div>
                                <div class="meta">Has Base64: ${f.base64 ? 'Yes (' + f.base64.length + ' chars)' : 'No'}</div>
                                <div class="actions">
                                    <button class="btn btn-danger" onclick="deleteMedia('${f.filename}')">Delete</button>
                                </div>
                            </div>
                        </div>
                    `}).join('');
                } else {
                    mediaGrid.innerHTML = '<div class="empty-state"><i class="fas fa-images"></i><p>No media uploaded yet</p></div>';
                }
            } catch (error) {
                console.error('Error loading media:', error);
                showStatus('Error loading media', 'error');
            }
        }
        
        // Delete media
        async function deleteMedia(filename) {
            if (confirm('Delete this media file?')) {
                try {
                    const response = await fetch(`/api/upload/files/${filename}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        showStatus('Media deleted successfully!', 'success');
                        loadMedia();
                    } else {
                        showStatus('Failed to delete media', 'error');
                    }
                } catch (error) {
                    showStatus('Error deleting media: ' + error.message, 'error');
                }
            }
        }
    </script>
</body>
</html>
